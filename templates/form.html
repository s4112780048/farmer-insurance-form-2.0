<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>農業保險申請表</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f7f7f7;
        padding: 16px;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: #fff;
        padding: 16px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 16px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 1rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 8px;
        font-size: 1rem;
        margin-top: 4px;
        box-sizing: border-box;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        font-size: 1.2rem;
        border: none;
        border-radius: 6px;
        background: #2c7be5;
        color: white;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        font-size: 0.8rem;
        color: #666;
      }
      .wallet-box {
        margin-bottom: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #eef2ff;
        font-size: 0.85rem;
      }
      .wallet-box small {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>農業保險申請表</h1>

      <!-- 連接錢包區塊 -->
      <div class="wallet-box">
        <button
          type="button"
          id="connect-wallet-btn"
          style="width: 100%; margin-top: 0; margin-bottom: 8px;"
        >
          連接 MetaMask 錢包（選填）
        </button>
        <small>
          當前錢包地址：
          <span id="wallet-address">尚未連接</span>
        </small>
      </div>

      <form method="post" action="/apply">
        <!-- 隱藏欄位：一併把錢包地址送到後端 -->
        <input type="hidden" name="walletAddress" id="walletAddress" />

        <label>
          農民姓名（必填）
          <input type="text" name="name" required />
        </label>

        <label>
          身分證字號（必填）
          <input type="text" name="idNumber" required />
        </label>

        <label>
          聯絡電話（必填）
          <input type="tel" name="phone" required />
        </label>

        <label>
          耕作地點（鄉鎮市、村里）（必填）
          <input type="text" name="location" required />
        </label>

        <label>
          作物種類（必填）
          <select name="crop" required>
            <option value="">請選擇</option>
            <option value="mango">芒果</option>
          </select>
        </label>

        <label>
          耕作面積（公頃）（必填）
          <input type="number" step="0.01" name="area" required />
        </label>

        <label>
          保險期間（例如：2025/01/01 - 2025/12/31）
          <input type="text" name="period" />
        </label>

        <label>
          保險種類
          <select name="plan">
            <option value="">請選擇</option>
            <option value="yield">產量保險</option>
            <option value="income">收入保險</option>
            <option value="weather">氣候指數保險</option>
          </select>
        </label>

        <label>
          匯款銀行與帳號
          <textarea
            name="bankInfo"
            rows="2"
            placeholder="例：XX銀行 OO分行，帳號 123-456-7890"
          ></textarea>
        </label>

        <label>
          備註
          <textarea name="note" rows="3"></textarea>
        </label>

        <p class="hint">※ 提交後資料將送交承辦單位處理。</p>

        <button type="submit">送出申請</button>
      </form>
    </div>

    <!-- 很重要：載入 wallet.js -->
    <script src="{{ url_for('static', filename='js/wallet.js') }}"></script>
  </body>
</html>
