<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>申請已送出</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f7f7f7;
        padding: 16px;
        text-align: center;
      }
      .card {
        max-width: 400px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 12px;
      }
      p {
        font-size: 1rem;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        text-decoration: none;
        padding: 10px 16px;
        border-radius: 6px;
        background: #2c7be5;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>申請已送出</h1>
      <p>{{ name }} 您好，您的農業保險申請資料已送出。</p>
      <p>承辦人員審核後，如有需要會再與您聯絡。</p>
      <a href="/apply">再填一筆申請</a>
    </div>
  </body>
</html>
